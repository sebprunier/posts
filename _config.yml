title: "sebprunier/blog"
description: "Retours d'expérience tech"
author:
  name: "Sébastien Prunier"

url: "https://sebprunier.github.io"
baseurl: "/posts"

remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "air"
locale: "fr"

# Multilingue (jekyll-polyglot)
languages: ["fr", "en"]
default_lang: "fr"
exclude_from_localization: ["assets"]
parallel_localization: false

plugins:
  - jekyll-polyglot
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

# Build
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Tags
tag_archive:
  type: liquid
  path: /tags/

defaults:
  # Layout pour tous les posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      show_date: true
  # Locale par langue
  - scope:
      path: "_posts/fr"
    values:
      locale: "fr"
  - scope:
      path: "_posts/en"
    values:
      locale: "en-US"

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
