<script>
  // Apply the saved theme before first paint (no flash); otherwise CSS follows the system preference
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<script>
  // Same-page anchor links: native scrollIntoView honors scroll-padding-top (sticky masthead),
  // and preventDefault makes the theme's SmoothScroll (fixed 20px offset) skip the click
  window.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('a[href*="#"]');
    if (!a || !a.hash || a.hostname !== location.hostname || a.pathname !== location.pathname) return;
    var target = document.getElementById(decodeURIComponent(a.hash.slice(1)));
    if (!target) return;
    e.preventDefault();
    if (location.hash !== a.hash) history.pushState(null, '', a.hash);
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
  }, true);
</script>


<script type="module">
  // Mermaid is only loaded on pages that contain a diagram, and follows the light/dark theme
  const diagrams = document.querySelectorAll('pre.mermaid');
  if (diagrams.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    diagrams.forEach((el) => { el.dataset.source = el.innerHTML; }); // innerHTML keeps <br/> in labels
    const isDark = () => {
      const t = document.documentElement.getAttribute('data-theme');
      return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    };
    const render = async () => {
      diagrams.forEach((el) => { el.removeAttribute('data-processed'); el.innerHTML = el.dataset.source; });
      mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'neutral' });
      await mermaid.run({ nodes: diagrams });
    };
    await render();
    document.addEventListener('themechange', render);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  }
</script>

<script>
  // Code blocks: header with the language name and a copy button
  document.addEventListener('DOMContentLoaded', function () {
    var labels = {% if site.active_lang == 'en' %}{ copy: 'Copy', copied: 'Copied!' }{% else %}{ copy: 'Copier', copied: 'Copié !' }{% endif %};
    document.querySelectorAll('.page__content div.highlighter-rouge').forEach(function (block) {
      var match = block.className.match(/language-(\S+)/);
      var header = document.createElement('div');
      header.className = 'code-header';
      var lang = document.createElement('span');
      lang.className = 'code-header__lang';
      lang.textContent = match && match[1] !== 'plaintext' ? match[1] : '';
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'code-header__copy';
      button.textContent = labels.copy;
      button.addEventListener('click', function () {
        var pre = block.querySelector('.rouge-code pre') || block.querySelector('pre');
        navigator.clipboard.writeText(pre.innerText).then(function () {
          button.textContent = labels.copied;
          setTimeout(function () { button.textContent = labels.copy; }, 1500);
        });
      });
      header.appendChild(lang);
      header.appendChild(button);
      block.insertBefore(header, block.firstChild);
    });
  });
</script>
